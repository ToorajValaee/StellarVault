name: Migration build

on:
  push:
    branches:
      - feature/maui-shared-app
  pull_request:
    branches:
      - main

jobs:
  browser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared Razor UI and Core
        run: dotnet build src/StellarVault.UI/StellarVault.UI.csproj --configuration Release
      - name: Restore .NET 10 browser host and shared core
        run: dotnet restore StellarVaultPwa.csproj
      - name: Build .NET 10 browser host and shared core
        run: dotnet build StellarVaultPwa.csproj --configuration Release --no-restore
      - name: Run .NET 10 authenticated encryption tests
        run: dotnet run --project tests/StellarVault.Core.CryptoTests/StellarVault.Core.CryptoTests.csproj --configuration Release
      - name: Run Node regression tests
        run: node --test tests/*.test.cjs

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android
      - name: Compile native Android preview
        run: dotnet build src/StellarVault.Maui/StellarVault.Maui.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk
