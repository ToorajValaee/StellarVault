name: Migration build

on:
  push:
    branches:
      - feature/maui-shared-app
  pull_request:
    branches:
      - main

jobs:
  browser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore existing browser host and shared core
        run: dotnet restore StellarVaultPwa.csproj
      - name: Build existing browser host and shared core
        run: dotnet build StellarVaultPwa.csproj --configuration Release --no-restore
      - name: Run Node regression tests
        run: node --test tests/*.test.cjs
