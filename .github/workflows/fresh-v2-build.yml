name: Fresh v2 PWA and MAUI build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/maui-shared-app
  pull_request:
    branches:
      - main

jobs:
  browser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared Razor UI and Core
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.UI/StellarVault.UI.csproj --configuration Release --verbosity normal 2>&1 | tee shared-ui-build.log
      - name: Restore .NET 10 browser host and shared core
        run: dotnet restore src/StellarVault.Pwa/StellarVault.Pwa.csproj
      - name: Build .NET 10 browser host and shared core
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.Pwa/StellarVault.Pwa.csproj --configuration Release --no-restore --verbosity normal 2>&1 | tee pwa-build.log
      - name: Publish deployable PWA
        run: dotnet publish src/StellarVault.Pwa/StellarVault.Pwa.csproj --configuration Release --no-restore --output ./artifacts/pwa
      - name: Validate published PWA assets
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/pwa/wwwroot
          test -s "$root/index.html"
          test -s "$root/_framework/blazor.webassembly.js"
          test -s "$root/service-worker.js"
          test -s "$root/service-worker-assets.js"
          test -s "$root/manifest.webmanifest"
          test -s "$root/css/app.css"
          test -s "$root/js/vault-v2-keywrap.js"
          test -s "$root/js/vault-v2-indexeddb.js"
          test -s "$root/js/ledger-compat/app.js"
          grep -q 'blazor.webassembly.js' "$root/index.html"
          grep -q 'service-worker-assets.js' "$root/service-worker.js"
      - name: Package verified PWA
        uses: actions/upload-artifact@v4
        with:
          name: stellarvault-pwa-release
          path: artifacts/pwa/wwwroot/
          if-no-files-found: error
      - name: Upload browser and shared build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-core-build-logs
          path: |
            shared-ui-build.log
            pwa-build.log
          if-no-files-found: ignore
      - name: Validate shipped JavaScript parses
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/pwa/wwwroot/js -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do node --check "$script"; done
      - name: Run browser checkpoint and native asset regression tests
        run: node --test tests/upload-checkpoint.test.cjs tests/maui-ledger-assets.test.cjs tests/recent-vault.test.cjs
      - name: Run .NET 10 authenticated encryption tests
        run: dotnet run --project tests/StellarVault.Core.CryptoTests/StellarVault.Core.CryptoTests.csproj --configuration Release

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android
      - name: Compile native Android preview
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.Maui/StellarVault.Maui.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk --verbosity normal 2>&1 | tee android-build.log
      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
