name: Fresh v2 PWA and MAUI build

on:
  push:
    branches:
      - feature/maui-shared-app
  pull_request:
    branches:
      - main

jobs:
  browser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared Razor UI and Core
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.UI/StellarVault.UI.csproj --configuration Release --verbosity normal 2>&1 | tee shared-ui-build.log
      - name: Restore .NET 10 browser host and shared core
        run: dotnet restore src/StellarVault.Pwa/StellarVault.Pwa.csproj
      - name: Build .NET 10 browser host and shared core
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.Pwa/StellarVault.Pwa.csproj --configuration Release --no-restore --verbosity normal 2>&1 | tee pwa-build.log
      - name: Upload browser and shared build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-core-build-logs
          path: |
            shared-ui-build.log
            pwa-build.log
          if-no-files-found: ignore
      - name: Run .NET 10 authenticated encryption tests
        run: dotnet run --project tests/StellarVault.Core.CryptoTests/StellarVault.Core.CryptoTests.csproj --configuration Release

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android
      - name: Compile native Android preview
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/StellarVault.Maui/StellarVault.Maui.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk --verbosity normal 2>&1 | tee android-build.log
      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
