services:
  stellarvault-landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LANDING_IMAGE:-stellarvault-landing:local-review}
    container_name: stellarvault-landing
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
