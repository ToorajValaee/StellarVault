server {
    listen 8080;
    listen [::]:8080;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;
    access_log off;
    error_log /dev/stderr crit;
    add_header_inherit merge;

    # Container health endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML and discovery files should always be revalidated.
    location ~* \.(?:html|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Stable filenames must revalidate after content changes.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # Serve normal files and directory indexes; fall back to 404.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
