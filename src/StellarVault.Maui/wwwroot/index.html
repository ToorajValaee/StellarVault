<!doctype html>
<html lang="en" data-stellar-vault-host="native">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f6">
  <title>StellarVault — Encrypted Account Database</title>
  <base href="/">
  <link rel="stylesheet" href="css/modern-app.css">
  <link rel="stylesheet" href="StellarVault.Maui.styles.css">
  <link rel="stylesheet" href="modern-native.css">
</head>
<body style="margin:0;background:#f3f7f6">
  <div id="app">Initializing StellarVault…</div>
  <div id="blazor-error-ui" hidden role="alert" style="position:fixed;inset:auto 1rem 1rem;z-index:9999;padding:1rem;background:#311e19;color:#fff;border:1px solid #ffb38a">
    StellarVault could not start its native interface. Check the device debug log and restart the application.
    <p data-startup-detail style="margin:.5rem 0">The native renderer did not initialize.</p>
    <a href="." style="color:#fff">RELOAD</a>
    <button type="button" class="dismiss" aria-label="Dismiss error">×</button>
  </div>
  <!-- The native interface starts independently of ledger assets.
       No BIP-39 or signer code is required to display the first screen. -->
  <script>
    // Host theme is available before the optional Stellar runtime loads.
    window.stellarVaultTheme = (() => {
      const key = 'stellar-vault-theme';
      function apply(value) {
        const theme = value === 'dark' || value === 'amber' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        try { localStorage.setItem(key, theme); } catch (_) {}
        return theme;
      }
      return Object.freeze({
        initialize() {
          let saved = 'light';
          try { saved = localStorage.getItem(key) || saved; } catch (_) {}
          return apply(saved);
        },
        toggle() { return apply(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
      });
    })();
  </script>
  <script>
    // Native-first startup: the hosted Blazor UI must render before the heavy
    // Stellar SDK / HD runtime. These scripts are loaded only on demand,
    // sequentially, so a missing runtime asset never blocks the whole app.
    // This list is local, packaged with the APK; no remote code is fetched.
    const nativeLedgerScripts = [
      "js/vendor/stellar-sdk.min.js",
      "js/bip39-english.js",
      "js/hd-keys.js",
      "js/vault-v2-mnemonic.js",
      "js/vault-v2-network.js",
      "js/hd-registry.js",
      "js/vault-v2-chain.js",
      "js/ledger-compat/hd-encryption.js",
      "js/ledger-compat/hd-allocation-preflight.js",
      "js/ledger-compat/hd-allocator.js",
      "js/ledger-compat/hd-sponsorship.js",
      "js/ledger-compat/hd-treasury.js",
      "js/ledger-compat/hd-fee-bump.js",
      "js/ledger-compat/hd-discovery.js",
      "js/ledger-compat/hd-bootstrap.js",
      "js/ledger-compat/app.js"
];
    let nativeLedgerLoad = null;
    window.stellarVaultNativeRuntime = Object.freeze({
      load() {
        if (nativeLedgerLoad) return nativeLedgerLoad;
        nativeLedgerLoad = (async () => {
          for (const source of nativeLedgerScripts) {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = source;
              script.async = false;
              script.onload = resolve;
              script.onerror = () => reject(new Error('Bundled native ledger resource unavailable'));
              document.body.appendChild(script);
            });
          }
          return true;
        })();
        return nativeLedgerLoad;
      },
      async inspect() {
        const sdk = window.StellarSdk;
        let cryptoReady = false;
        try {
          // Exercise the actual crypto implementation without processing user data.
          const random = new Uint8Array(16);
          globalThis.crypto.getRandomValues(random);
          const digest = await globalThis.crypto.subtle.digest('SHA-256', new Uint8Array(0));
          cryptoReady = random.some(byte => byte !== 0) && digest.byteLength === 32;
          random.fill(0);
        } catch {
          cryptoReady = false;
        }
        const bip39Ready = Array.isArray(window.stellarVaultBip39English) &&
          window.stellarVaultBip39English.length === 2048;
        const hdReady = typeof window.stellarVaultHd?.deriveKeypair === 'function';
        const ledgerReady = typeof window.stellarVault?.network?.inspectHorizon === 'function' &&
          typeof window.stellarVault?.stellar?.openHdSession === 'function' &&
          typeof window.stellarVault?.stellar?.deleteSession === 'function';
        const sdkReady = typeof sdk?.Keypair?.fromRawEd25519Seed === 'function';
        return { ready: cryptoReady && bip39Ready && hdReady && ledgerReady && sdkReady,
          cryptoReady, bip39Ready, hdReady, ledgerReady, sdkReady };
      }
    });
  </script>
  <script>
    // Do not display JS exception messages: third-party scripts could include user data.
    // Surface a non-secret startup failure instead of leaving an endless loading label.
    window.addEventListener('error', () => {
      if (document.querySelector('#app')?.textContent?.includes('Initializing StellarVault')) {
        document.getElementById('blazor-error-ui').hidden = false;
      }
    });
    window.addEventListener('unhandledrejection', () => {
      if (document.querySelector('#app')?.textContent?.includes('Initializing StellarVault')) {
        document.getElementById('blazor-error-ui').hidden = false;
      }
    });
  </script>
  <script>
    // The BlazorWebView bridge can fail without emitting a window error.
    // Show a safe actionable message rather than an endless splash label.
    // Never print user inputs, mnemonic, cryptographic keys, or runtime objects.
    (function () {
      const initialText = 'Initializing StellarVault';
      let startupFailureShown = false;
      function showStartupFailure(message) {
        if (startupFailureShown) return;
        const root = document.getElementById('app');
        if (!root || !root.textContent.includes(initialText)) return;
        startupFailureShown = true;
        const alert = document.getElementById('blazor-error-ui');
        if (alert) {
          alert.hidden = false;
          const note = alert.querySelector('[data-startup-detail]');
          if (note) note.textContent = message;
        }
      }
      window.stellarVaultShowStartupFailure = showStartupFailure;
      window.addEventListener('load', () => {
        window.setTimeout(() => showStartupFailure(
          'The native BlazorWebView did not render its first screen. Check the Android app log for BlazorWebView startup errors and reinstall the latest APK.'
        ), 12000);
      }, { once: true });
    })();
  </script>
  <script src="_framework/blazor.webview.js" autostart="false" onerror="window.stellarVaultShowStartupFailure && window.stellarVaultShowStartupFailure('BlazorWebView bootstrap script is missing from the packaged Android app.')"></script>
</body>
</html>
