<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07110c" />
    <meta name="description" content="A mobile-first encrypted Stellar account-chain credential vault, powered by BADJE.IR." />
    <meta name="author" content="Tooraj Valaee" />
    <meta name="application-name" content="Stellar Vault Terminal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Stellar Vault" />
    <meta name="format-detection" content="telephone=no" />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Stellar Vault Terminal — Encrypted Credential Vault</title>
</head>
<script>
    (function () {
        function stabilizeViewport() {
            document.documentElement.style.zoom = "1";
            window.scrollTo(0, 0);
        }

        window.addEventListener("load", stabilizeViewport);
        window.addEventListener("pageshow", stabilizeViewport);
        window.addEventListener("resize", stabilizeViewport);
    })();
</script>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-logo">SV</div>
            <div class="boot-line">INITIALIZING WEBASSEMBLY TERMINAL<span>_</span></div>
            <div class="boot-progress"><i></i></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        TERMINAL FAILURE. <a href="." class="reload">RELOAD</a>
        <a class="dismiss">×</a>
    </div>

    <script src="js/vendor/stellar-sdk.min.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.error('Service worker registration failed:', error));
        }
    </script>
</body>
</html>
