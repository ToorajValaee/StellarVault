<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07110c" />
    <meta name="description" content="A mobile-first encrypted Stellar account-chain credential vault." />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Stellar Vault Terminal — Encrypted Credential Vault</title>

    <meta name="description"
          content="A mobile-first encrypted credential vault powered by Stellar account data, featuring a retro terminal interface and Progressive Web App support.">

    <meta property="og:title"
          content="Stellar Vault Terminal — Encrypted Credential Vault">

    <meta property="og:description"
          content="Securely manage encrypted credentials through a mobile-first retro terminal PWA.">

    <meta property="og:type"
          content="website">

    <meta property="og:image"
          content="/images/social-preview.png">

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="theme-color"
          content="#07140d">
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-logo">SV</div>
            <div class="boot-line">INITIALIZING WEBASSEMBLY TERMINAL<span>_</span></div>
            <div class="boot-progress"><i></i></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        TERMINAL FAILURE. <a href="." class="reload">RELOAD</a>
        <a class="dismiss">×</a>
    </div>

    <script src="js/vendor/stellar-sdk.min.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.error('Service worker registration failed:', error));
        }
    </script>
</body>
</html>
