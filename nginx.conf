server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    client_max_body_size 1k;
    access_log off;
    etag on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:*; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/json text/css image/svg+xml;

    location = /health/ready { default_type text/plain; return 200 "ready\n"; }
    location ~ /\. { return 404; }
    location ^~ /v1/ { return 404; }
    location ^~ /_framework/ { try_files $uri =404; }
    location ~* \.(js|wasm|dll|dat|json|css|svg|png|ico|webmanifest|woff|woff2)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
