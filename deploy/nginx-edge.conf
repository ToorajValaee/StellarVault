# Certificates are operator-managed, mounted read-only, and never in an image.
# One certificate must cover svault.ir, app.svault.ir and api.svault.ir.
server_tokens off;
access_log off;
error_log /dev/stderr crit;
client_max_body_size 128k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
ssl_certificate /etc/stellarvault/tls/current/fullchain.pem;
ssl_certificate_key /etc/stellarvault/tls/current/privkey.pem;

server {
    listen 8080 default_server;
    server_name _;
    location = /health/ready { access_log off; return 200 'ready\n'; }
    location / { return 444; }
}
server {
    listen 8080;
    server_name svault.ir app.svault.ir api.svault.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 8443 ssl;
    server_name svault.ir;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    access_log off;
    location / {
        proxy_pass http://landing:8080;
        proxy_set_header Host svault.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 8443 ssl;
    server_name app.svault.ir;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    # Never log query strings, credentials or request/response bodies.
    access_log off;
    location / {
        proxy_pass http://pwa:8080;
        proxy_set_header Host app.svault.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 8443 ssl;
    server_name api.svault.ir;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    access_log off;
    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host api.svault.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
