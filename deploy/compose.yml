services:
  landing:
    image: ${LANDING_IMAGE:?Set LANDING_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 128m
    pids_limit: 128
    networks:
      application:
        ipv4_address: 172.30.31.5
  pwa:
    image: ${PWA_IMAGE:?Set PWA_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 128m
    pids_limit: 128
    networks:
      application:
        ipv4_address: 172.30.31.2
  api:
    image: ${API_IMAGE:?Set API_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 256m
    pids_limit: 128
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: api.svault.ir;localhost;127.0.0.1;[::1]
      ApiHosting__TrustedProxies__0: 172.30.31.4
    volumes:
      - type: bind
        source: ${API_SETTINGS_FILE:?Set API_SETTINGS_FILE to an operator-owned configuration file}
        target: /app/appsettings.Production.json
        read_only: true
    networks:
      application:
        ipv4_address: 172.30.31.3
  edge:
    image: ${EDGE_IMAGE:?Set EDGE_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 128m
    pids_limit: 128
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443
    volumes:
      - type: bind
        source: ${EDGE_CONFIG_FILE:-./nginx-edge.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${TLS_CERTIFICATE_DIR:?Set TLS_CERTIFICATE_DIR to the operator-owned certificate directory}
        target: /etc/stellarvault/tls
        read_only: true
      - type: bind
        source: ${ACME_WEBROOT:?Set ACME_WEBROOT to the operator-owned ACME challenge directory}
        target: /var/www/acme
        read_only: true
    depends_on:
      landing:
        condition: service_healthy
      pwa:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      application:
        ipv4_address: 172.30.31.4
networks:
  application:
    ipam:
      config:
        - subnet: 172.30.31.0/29
