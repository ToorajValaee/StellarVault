services:
  pwa:
    image: ${PWA_IMAGE:?Set PWA_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    mem_limit: 128m
    pids_limit: 128
    networks:
      application:
        ipv4_address: 172.30.31.2
  api:
    image: ${API_IMAGE:?Set API_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    mem_limit: 256m
    pids_limit: 128
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: api.svault.ir;localhost;127.0.0.1;[::1]
      ApiHosting__TrustedProxies__0: 172.30.31.4
    volumes:
      - type: bind
        source: ${API_SETTINGS_FILE:?Set API_SETTINGS_FILE to an operator-owned configuration file}
        target: /app/appsettings.Production.json
        read_only: true
    networks:
      application:
        ipv4_address: 172.30.31.3
  edge:
    image: ${EDGE_IMAGE:?Set EDGE_IMAGE to a verified immutable release image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    mem_limit: 128m
    pids_limit: 128
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - type: bind
        source: ${CADDY_CONFIG_FILE:-./Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pwa:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      application:
        ipv4_address: 172.30.31.4
networks:
  application:
    ipam:
      config:
        - subnet: 172.30.31.0/29
volumes:
  caddy_data:
  caddy_config:
