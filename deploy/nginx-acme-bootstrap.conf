# Temporary challenge-only configuration before the first certificate exists.
server_tokens off;
server {
    listen 8080 default_server;
    server_name _;
    location / { return 444; }
}
server {
    listen 8080;
    server_name svault.ir app.svault.ir api.svault.ir;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 503; }
}
